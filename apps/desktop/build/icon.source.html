<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;background:transparent}
  /* macOS 的 Dock 图标标准是 1024 画布里占 824，四周留透明边距——
     铺满的话它会比旁边所有图标都显大一圈 */
  .pad{width:1024px;height:1024px;display:flex;align-items:center;justify-content:center}
  .mark{width:824px;height:824px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#2a2a31 0%,#131317 100%);border-radius:184px;
    box-shadow:0 12px 40px rgba(0,0,0,.28)}
  .glyph{color:#fff;font-family:"PingFang SC","Songti SC",serif;font-size:450px;font-weight:600;
    line-height:1;transform:translateY(-6px)}
</style></head><body><div class="pad"><div class="mark"><div class="glyph">同</div></div></div></body></html>
