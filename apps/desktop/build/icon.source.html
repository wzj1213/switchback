<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Switchback 图标源稿</title>
  <style>
    /* 与侧栏、空会话共用三线汇合的轮廓。左右端点含圆帽都在视口内，
       单条不透明路径消除交叠接缝；100px 外留白与 75% 内图形保持居中。
       修改后运行 pnpm 图标，同时检查 16 / 32 / 64px 的实际栅格。 */
    html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
    body { display: grid; place-items: center; }
    .mark {
      width: 824px; height: 824px; border-radius: 184px;
      background: linear-gradient(155deg, #3b3b46, #17171c);
      display: grid; place-items: center;
    }
    .symbol { width: 75%; height: 75%; }
  </style>
</head>
<body>
  <div class="mark"><img class="symbol" src="../src/renderer/assets/switchback-symbol.svg" alt=""></div>
</body>
</html>
