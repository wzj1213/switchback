# 打包配置。目标：能装、能双击打开、图标是自己的。
#
# 这一步之前 omni 只能从开发目录跑（`pnpm dev` 或者手动调 Electron 二进制）。
# 一个只能在 checkout 里跑的东西不算产品。

appId: dev.wzj.omni
productName: omni
copyright: omni · 同文

directories:
  buildResources: build
  output: ../../release

# 只打构建产物。源码、测试、workspace 的其他包都已经被 electron-vite
# 打进 out/ 了，再塞一遍源码只会让包大一倍还泄漏内部结构。
files:
  - out/**
  - package.json

# 浏览器端的构建产物，落在 `<Contents>/Resources/web`。
#
# **放 extraResources 而不是打进 asar**：asar 里的文件没有真实路径，
# 而这些是要被 `createReadStream` 一个个送出去的静态文件。放外面还省掉
# 每次读都过一层 asar 解析。运行时由 `remote/install.ts` 的 `webRoot()`
# 按 `process.resourcesPath` 找它。
#
# 没有它的话远程服务端照常起、API 照常通，只是页面 404——那是有意的降级，
# 但发版时不该发生：`pnpm dist` 会先跑 `@omni/web` 的 build。
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"

# Claude Agent SDK 要 spawn 自带的 CLI，不能进 asar——
# asar 里的文件没有真实路径，它找不到自己的资源。
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  # 强化运行时**常开**，不等有了 Developer ID 才开。
  #
  # 理由是这条最容易在最后一刻咬人：公证强制要求强化运行时，而强化运行时
  # 默认会掐掉 JIT 和「加载别人签的二进制」——后者正是 omni 的核心功能
  # （spawn codex / ACP 适配器 / Claude SDK 自带的 CLI）。
  # 等付完 99 刀那天才第一次打开它，就要在最不该调试的时刻调试它。
  # 现在用自签证书就能把这条路走通，授权清单见 build/entitlements.mac.plist。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # 子进程继承的那份。少了它，Electron 的 Helper 进程拿不到 JIT 授权，
  # 渲染层直接起不来
  entitlementsInherit: build/entitlements.mac.plist
  # 自签证书过不了 Gatekeeper 评估，这一步跳过。有了真证书之后
  # 公证流程自己会做这件事
  gatekeeperAssess: false
  # **这里有意不写 `identity`**，签不签由脚本决定：
  #
  #   pnpm dist          → `CSC_IDENTITY_AUTO_DISCOVERY=false`，明确不签
  #   pnpm dist:signed   → 放开，用 CSC_NAME / CSC_LINK 指定的证书
  #
  # 两个坑都是实测踩出来的：
  #
  # 1. `identity: ${env.CSC_NAME}` 不行——electron-builder 不对这个字段做变量
  #    展开，拿到的是字面量，然后报「钥匙串里没有这个证书」。
  # 2. **什么都不写也不行**：那样 electron-builder 会去翻钥匙串，
  #    抓到任何一张证书就开始签。本机那张自签的会让 `codesign` 卡在
  #    逐个文件签名上——`pnpm dist` 跑了 400 秒还停在 `locale.pak`，
  #    最后要手动 kill。所以默认那条脚本必须显式关掉自动发现。

# 产物文件名。**必须显式写。**
#
# 不写的话 Linux / Windows 那边会用 package.json 的 `name`，
# 而这个包叫 `@omni/desktop`——于是产物落在 `release/@omni/desktop-0.0.0.tar.gz`，
# 那个 `@omni` 变成了一级目录。实测踩到的。
artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: omni ${version}

# ── 以下两个平台：配置写好了，但**没有在真机上跑过** ──────────────
#
# 不进默认的 `pnpm dist`（那条只打 mac），要用得显式说：
#   pnpm --filter @omni/desktop exec electron-builder --linux
#   pnpm --filter @omni/desktop exec electron-builder --win
#
# **已知会缺一块**：Claude Agent SDK 的平台二进制是 optionalDependencies，
# pnpm 10+ 不会自动装别的平台那几个。实测打 Linux 包时 electron-builder
# 明确警告 `@anthropic-ai/claude-agent-sdk-linux-*` 没被打进去——
# 也就是说**那个包里的 Claude 引擎根本起不来**。
# 要真支持，得先把对应平台的那几个加进 optionalDependencies 并在真机上验一遍。
linux:
  category: Development
  icon: build/icon.icns
  target:
    - tar.gz
    - AppImage

win:
  target:
    - zip

# 公证。**没有凭据时整段跳过**——`notarize: false` 是默认值，
# 只有 CI 上带齐 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
# 才走这一步。缺凭据时报错退出，比悄悄产出一个没公证的包好。
#
# 需要什么，一次说清楚：
#   1. Apple Developer Program 会员（99 美元/年）
#   2. 钥匙串里的 "Developer ID Application: <名字> (<TeamID>)" 证书
#   3. App Store Connect 的 app-specific password
# 齐了之后：CSC_NAME=... APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... \
#           APPLE_TEAM_ID=... pnpm dist
