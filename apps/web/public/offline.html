<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111113" />
    <meta http-equiv="refresh" content="10" />
    <title>omni · 正在重连</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; color: #202022; background: #f5f5f3; }
      main { width: min(100% - 40px, 520px); margin: 0 auto; padding: max(52px, env(safe-area-inset-top)) 0 40px; }
      .brand { margin-bottom: clamp(72px, 20vh, 164px); color: #606064; font-size: 13px; font-weight: 650; letter-spacing: .02em; }
      .state { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; color: #68686d; font-size: 13px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #b78c24; box-shadow: 0 0 0 4px #b78c2418; }
      h1 { max-width: 430px; margin: 0; font-size: clamp(25px, 7vw, 34px); line-height: 1.2; letter-spacing: -.025em; }
      .explain { max-width: 440px; margin: 18px 0 28px; color: #66666b; }
      .retry { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border: 1px solid #d1d1ce; border-radius: 10px; color: inherit; background: #fff; font-weight: 600; text-decoration: none; }
      .hint { margin: 14px 0 0; color: #85858a; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        body { color: #ececee; background: #111113; }
        .brand, .state, .explain { color: #a3a3aa; }
        .dot { background: #d0a13a; box-shadow: 0 0 0 4px #d0a13a22; }
        .retry { border-color: #3b3b3f; background: #1c1c1f; }
        .hint { color: #77777e; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">omni</div>
      <p class="state"><span class="dot" aria-hidden="true"></span>正在等那台 Mac</p>
      <h1>界面已经准备好，那台 Mac 还没连上。</h1>
      <p class="explain">可能是电脑正在睡眠、隧道暂时断开，或当前网络不可用。这里没有缓存旧会话；连通后会重新取得当前版本和最新状态。</p>
      <a class="retry" href="">现在重试</a>
      <p class="hint">页面每 10 秒自动重试一次。</p>
    </main>
  </body>
</html>
