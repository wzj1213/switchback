<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" width="1000" height="424" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How a relay works</title>
<desc id="dsc">One work line moves from Claude Code to Codex to Kimi Code and back to Claude Code, over the same workspace. Each engine keeps its own native session.</desc>

<style>
  svg { --paper:#ffffff; --ground:#f2f2f0; --lane:#f7f7f5; --ink1:#18181b; --ink2:#4a4a52; --ink3:#696970;
        --line:#dcdcd8; --soft:#ebebe8; --blue:#3451e0; --blue-soft:rgba(52,81,224,.09); --contour:rgba(24,24,27,.055);
        --glint:rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark) {
    svg { --paper:#1b1b1e; --ground:#141416; --lane:#232327; --ink1:#ececee; --ink2:#b4b4bb; --ink3:#96969e;
          --line:#3c3c43; --soft:#2c2c31; --blue:#8296ff; --blue-soft:rgba(130,150,255,.13); --contour:rgba(236,236,238,.05);
          --glint:rgba(255,255,255,.75); }
  }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif; fill:var(--ink2); }
  .mono { font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; }
  .t1 { font-size:20px; font-weight:650; fill:var(--ink1); letter-spacing:-.01em; }
  .t2 { font-size:13.5px; fill:var(--ink2); }
  .h { font-size:14px; font-weight:600; fill:var(--ink1); }
  .b { font-size:12.5px; fill:var(--ink2); }
  .c { font-size:12px; fill:var(--ink3); }
  .k { font-size:12.5px; font-weight:600; fill:var(--ink1); }
  .blue { fill:var(--blue); }
  .paper { fill:var(--paper); stroke:var(--soft); }
  .lane { fill:var(--lane); }
  .ground { fill:var(--ground); }
  .box { fill:var(--paper); stroke:var(--line); }
  .panel { fill:var(--lane); stroke:var(--line); }
  .stratum { fill:var(--paper); stroke:var(--line); }
  .contour { fill:none; stroke:var(--contour); stroke-width:1.2; }
  .wire { fill:none; stroke:var(--line); stroke-width:1.5; }
  .lead { fill:none; stroke:var(--ink3); stroke-width:1; stroke-dasharray:2 3; }
  .door { fill:none; stroke:var(--blue); stroke-width:1.6; }
  .halo { fill:none; stroke:var(--blue-soft); stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
  .tick { fill:var(--paper); stroke:var(--blue); stroke-width:1.6; }
  .pill { fill:var(--paper); stroke:var(--line); }
  .grid { fill:var(--contour); }
  .frame { fill:none; stroke:var(--ink3); stroke-width:1.2; stroke-dasharray:5 5; opacity:.55; }
  .trail { fill:none; stroke:var(--blue); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
  .ring { fill:var(--paper); stroke:var(--blue); stroke-width:3; }
  .dot { fill:var(--blue); }
  .chip { fill:var(--blue-soft); }
  .pulse { fill:none; stroke:var(--glint); stroke-width:3; stroke-linecap:round; opacity:0; }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { stroke-dasharray:.05 1; animation:travel 7s cubic-bezier(.45,0,.25,1) 1s infinite; }
  }
  @keyframes travel {
    0% { stroke-dashoffset:.05; opacity:0; } 6% { opacity:1; } 62% { stroke-dashoffset:-1; opacity:1; }
    66%, 100% { stroke-dashoffset:-1; opacity:0; }
  }
</style>

<rect x="0.5" y="0.5" width="999" height="423" rx="14" class="paper"/>
<path class="contour" d="M0,394.0 C330,383.0 390,405.0 500,394.0 S740,380.8 1000,389.6"/>
<path class="contour" d="M0,372.0 C330,358.2 390,385.8 500,372.0 S740,355.5 1000,366.5"/>
<path class="contour" d="M0,348.5 C330,332.0 390,365.0 500,348.5 S740,328.7 1000,341.9"/>
<path class="contour" d="M0,323.5 C330,312.5 390,334.5 500,323.5 S740,310.3 1000,319.1"/>
<path class="contour" d="M0,297.0 C330,283.2 390,310.8 500,297.0 S740,280.5 1000,291.5"/>
<path class="contour" d="M0,269.0 C330,252.5 390,285.5 500,269.0 S740,249.2 1000,262.4"/>
<path class="contour" d="M0,239.5 C330,228.5 390,250.5 500,239.5 S740,226.3 1000,235.1"/>
<path class="contour" d="M0,208.5 C330,194.8 390,222.2 500,208.5 S740,192.0 1000,203.0"/>
<path class="contour" d="M0,176.0 C330,159.5 390,192.5 500,176.0 S740,156.2 1000,169.4"/>
<path class="contour" d="M0,142.0 C330,131.0 390,153.0 500,142.0 S740,128.8 1000,137.6"/>
<path class="contour" d="M0,106.5 C330,92.8 390,120.2 500,106.5 S740,90.0 1000,101.0"/>
<path class="contour" d="M0,69.5 C330,53.0 390,86.0 500,69.5 S740,49.7 1000,62.9"/>
<path class="contour" d="M0,31.0 C330,20.0 390,42.0 500,31.0 S740,17.8 1000,26.6"/>
<text x="36" y="50" class="t1">How a relay works</text>
<text x="36" y="74" class="t2">Each engine runs its own native session. Switchback carries one work line across them, and back again.</text>
<rect x="36" y="106" width="928" height="44" rx="10" class="lane"/>
<text x="56" y="133" class="h">Claude Code</text>
<rect x="150" y="117" width="109" height="22" rx="11" class="pill"/>
<text x="157" y="132" class="c mono">session 4f2a…</text>
<rect x="36" y="162" width="928" height="44" rx="10" class="lane"/>
<text x="56" y="189" class="h">Codex</text>
<rect x="150" y="173" width="102" height="22" rx="11" class="pill"/>
<text x="157" y="188" class="c mono">thread 9c1e…</text>
<rect x="36" y="218" width="928" height="44" rx="10" class="lane"/>
<text x="56" y="245" class="h">Kimi Code</text>
<rect x="150" y="229" width="109" height="22" rx="11" class="pill"/>
<text x="157" y="244" class="c mono">session 7b03…</text>
<path class="halo" d="M280,128 H430 C462,128 458,184 490,184 H650 C682,184 678,240 710,240 H792 C846,240 818,128 872,128 H944"/>
<path class="trail" d="M280,128 H430 C462,128 458,184 490,184 H650 C682,184 678,240 710,240 H792 C846,240 818,128 872,128 H944"/>
<path class="pulse" pathLength="1" d="M280,128 H430 C462,128 458,184 490,184 H650 C682,184 678,240 710,240 H792 C846,240 818,128 872,128 H944"/>
<circle cx="306" cy="128" r="3.2" class="tick"/>
<circle cx="343" cy="128" r="3.2" class="tick"/>
<circle cx="380" cy="128" r="3.2" class="tick"/>
<circle cx="414" cy="128" r="3.2" class="tick"/>
<circle cx="530" cy="184" r="3.2" class="tick"/>
<circle cx="572" cy="184" r="3.2" class="tick"/>
<circle cx="614" cy="184" r="3.2" class="tick"/>
<circle cx="744" cy="240" r="3.2" class="tick"/>
<circle cx="774" cy="240" r="3.2" class="tick"/>
<circle cx="908" cy="128" r="3.2" class="tick"/>
<text x="358" y="147" class="c" text-anchor="middle">turns 1–4</text>
<text x="572" y="203" class="c" text-anchor="middle">turns 5–7</text>
<text x="759" y="259" class="c" text-anchor="middle">turns 8–9</text>
<text x="908" y="147" class="c" text-anchor="middle">turn 10</text>
<circle cx="280" cy="128" r="6" class="dot"/>
<circle cx="490" cy="184" r="7.5" class="ring"/>
<circle cx="710" cy="240" r="7.5" class="ring"/>
<circle cx="872" cy="128" r="7.5" class="ring"/>
<path d="M956,128 l-12,-7 v14 z" class="dot"/>
<path class="lead" d="M490,193 V296"/>
<path class="lead" d="M872,137 V296"/>
<text x="490" y="314" class="k" text-anchor="middle">Handoff note: who ran which turns, and where</text>
<text x="490" y="331" class="b" text-anchor="middle">the transcript and raw logs are. No prompt, no summary.</text>
<text x="872" y="314" class="k" text-anchor="middle">Switch back</text>
<text x="872" y="331" class="b" text-anchor="middle">Claude Code resumes session 4f2a</text>
<rect x="36" y="356" width="928" height="44" rx="10" class="ground"/>
<text x="56" y="383" class="h">Same workspace on disk</text>
<text x="232" y="383" class="b">Every engine edits the same files, and Switchback reviews the diff from git.</text>
</svg>
